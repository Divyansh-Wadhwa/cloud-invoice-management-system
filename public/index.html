<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Invoice Manager</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;margin:5px;border:1px solid #ddd;border-radius:7px}button{cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.item{border:1px solid #eee;padding:10px;border-radius:8px;margin:8px 0}.muted{color:#6b7280}</style></head><body><div class="wrap"><h1>Cloud-Based Invoice Management System</h1><p class="muted">Customers · Products · Invoices · Private PDF storage</p><div class="card"><h2>Create Invoice</h2><div class="row"><select id="customer"></select><input id="discount" type="number" placeholder="Discount" value="0"></div><div id="items"></div><button onclick="addItem()">+ Add Product</button><button onclick="createInvoice()">Generate Invoice</button><pre id="result"></pre></div><div class="card"><h2>Recent Invoices</h2><button onclick="loadInvoices()">Refresh</button><div id="invoices"></div></div></div><script>
let products=[];
async function init(){products=await fetch('/api/products').then(r=>r.json());let c=await fetch('/api/customers').then(r=>r.json());customer.innerHTML=c.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');addItem();loadInvoices()}
function addItem(){let d=document.createElement('div');d.className='item';d.innerHTML=`<select class="prod">${products.map(p=>`<option value="${p.id}">${p.name} — Rs.${p.price}</option>`).join('')}</select><input class="qty" type="number" min="1" value="1"><button onclick="this.parentElement.remove()">Remove</button>`;items.appendChild(d)}
async function createInvoice(){let payload={customer_id:Number(customer.value),discount:Number(discount.value||0),items:[...document.querySelectorAll('.item')].map(x=>({product_id:Number(x.querySelector('.prod').value),quantity:Number(x.querySelector('.qty').value)}))};let r=await fetch('/api/invoices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=await r.json();result.textContent=r.ok?`Invoice ${j.invoice_number}\nTotal: Rs.${j.total.toFixed(2)}\n${j.download_url}`:j.error;loadInvoices()}
async function loadInvoices(){let a=await fetch('/api/invoices').then(r=>r.json());invoices.innerHTML=a.map(x=>`<div class="item"><b>${x.invoice_number}</b> — ${x.customer_name} — Rs.${Number(x.total).toFixed(2)} — ${new Date(x.created_at).toLocaleString()} <button onclick="download(${x.id})">PDF</button></div>`).join('')}
async function download(id){let j=await fetch('/api/invoices/'+id+'/download').then(r=>r.json());if(j.url)window.open(j.url,'_blank')}
init();</script></body></html>
